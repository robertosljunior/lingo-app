name: apply-scramble-ui-patch

on:
  push:
    branches: [fix/scramble-semantic-distractors]
    paths:
      - .github/workflows/apply-scramble-ui-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scramble-semantic-distractors
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align word-order visual state with target length
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = 'src/components/pedagogy-v2-learner/V2LearnerActivity.jsx'
          let s = fs.readFileSync(path, 'utf8')
          const oldImport = 'wordOrderBank, wordOrderBankItems, wordOrderMove, wordOrderPayload, wordOrderPlace, wordOrderRailItems, wordOrderRemove,'
          const newImport = 'wordOrderBank, wordOrderBankItems, wordOrderComplete, wordOrderMove, wordOrderPayload, wordOrderPlace, wordOrderRailItems, wordOrderRemove,'
          if (!s.includes(oldImport)) throw new Error('word-order import anchor not found')
          s = s.replace(oldImport, newImport)
          const oldState = ": picked.length === bank.length ? 'complete'"
          const newState = ": wordOrderComplete(bank, picked) ? 'complete'"
          if (!s.includes(oldState)) throw new Error('word-order state anchor not found')
          s = s.replace(oldState, newState)
          fs.writeFileSync(path, s)
          NODE
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/pedagogy-v2-learner/V2LearnerActivity.jsx
          git commit -m "fix: align scramble completion state with target length"
          git push
