name: v3-combinatorial-supply

on:
  pull_request:
    paths:
      - 'src/content/pedagogy-v3/**'
      - 'src/lib/pedagogy-v3/**'
      - 'scripts/audit-combinatorial-supply-v3.mjs'
      - 'package.json'
      - '.github/workflows/v3-combinatorial-supply.yml'

permissions:
  contents: read

jobs:
  supply:
    name: 2000+ unique realizations and no-repeat selector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused V3 unit tests
        run: npx vitest run src/lib/pedagogy-v3/combinatorial-supply.test.js
      - name: Supply audit
        run: npm run audit:combinatorial-supply-v3
