name: required

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: required-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-contract:
    name: PR verification contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require reproducible PR metadata
        run: node scripts/check-pr-contract.mjs "$GITHUB_EVENT_PATH"

  quality:
    name: unit, pedagogy, build and browser
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Dependency advisory budget
        run: npm run audit:dependencies

      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: dependency-audit.json
          if-no-files-found: warn
          retention-days: 30

      - name: Unit tests
        run: npm test

      - name: Validate pedagogy V2
        run: npm run validate:pedagogy-v2

      - name: Pedagogy V2 deterministic simulation
        run: npm run simulate:pedagogy-v2 -- --scenario all --check-determinism

      - name: Build
        run: npm run build

      - name: IndexedDB benchmark
        run: npm run benchmark:indexeddb

      - name: Playwright functional E2E — zero retries
        run: npm run test:e2e:ci

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces, screenshots and videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14

  required-gate:
    name: full-quality-gate
    if: always()
    needs: [pr-contract, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject any incomplete or red prerequisite
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONTRACT_RESULT: ${{ needs.pr-contract.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          echo "event=$EVENT_NAME contract=$CONTRACT_RESULT quality=$QUALITY_RESULT"
          test "$QUALITY_RESULT" = "success"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            test "$CONTRACT_RESULT" = "success"
          fi
