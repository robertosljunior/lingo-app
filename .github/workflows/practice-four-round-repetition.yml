name: Practice four-round repetition audit

on:
  push:
    branches:
      - agent/test-practice-four-round-repetition
    paths:
      - .github/workflows/practice-four-round-repetition.yml
      - e2e/practice-four-round-repetition.spec.js
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/practice-four-round-repetition.yml
      - e2e/practice-four-round-repetition.spec.js
  workflow_dispatch:

permissions:
  contents: read

jobs:
  practice-four-round-repetition:
    name: Four complete Praticar rounds
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run four-round Praticar repetition audit
        run: npx playwright test e2e/practice-four-round-repetition.spec.js --project=chromium-desktop --workers=1
        env:
          CI: true

      - name: Upload repetition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: practice-four-round-repetition-report
          path: |
            test-results/practice-four-round-repetition/**
            playwright-report/**
          if-no-files-found: warn
          retention-days: 14
