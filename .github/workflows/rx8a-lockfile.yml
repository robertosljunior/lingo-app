name: rx8a-lockfile

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/rx8a-lockfile.yml

permissions:
  contents: read

jobs:
  generate-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve patched dependency graph
        run: npm update brace-expansion fast-uri js-yaml postcss --package-lock-only --ignore-scripts
      - name: Verify reproducible install metadata
        run: npm install --package-lock-only --ignore-scripts
      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: rx8a-package-lock
          path: package-lock.json
          retention-days: 3
