name: Practice ten-round recipe audit

on:
  push:
    branches:
      - agent/test-practice-ten-round-recipe-audit
    paths:
      - .github/workflows/practice-ten-round-recipe-audit.yml
      - e2e/practice-ten-round-recipe-audit.spec.js
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/practice-ten-round-recipe-audit.yml
      - e2e/practice-ten-round-recipe-audit.spec.js
  workflow_dispatch:

permissions:
  contents: read

jobs:
  practice-ten-round-recipe-audit:
    name: Ten complete Praticar rounds
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run ten-round Praticar recipe audit
        run: npx playwright test e2e/practice-ten-round-recipe-audit.spec.js --project=chromium-desktop --workers=1
        env:
          CI: true

      - name: Upload recipe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: practice-ten-round-recipe-audit-report
          path: |
            test-results/practice-ten-round-recipe-audit/**
            playwright-report/**
          if-no-files-found: warn
          retention-days: 14
